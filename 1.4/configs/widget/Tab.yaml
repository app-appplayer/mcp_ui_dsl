name: Tab
description: |
  One tab of a tab bar.

  Keys the runtime reads are declared with their types; a document may carry
  further keys, which the runtime ignores rather than refusing — an item shape
  that rejected an unknown key would break every document that carries one for
  its own bookkeeping.
definition:
  {
    "type": "object",
    "properties": {
      "label": {
        "type": "string"
      },
      "text": {
        "type": "string"
      },
      "icon": {
        "$ref": "#/$defs/IconRef"
      },
      "iconMargin": {
        "$ref": "#/$defs/EdgeInsets"
      },
      "height": {
        "$ref": "#/$defs/Dimension"
      }
    },
    "additionalProperties": true
  }
