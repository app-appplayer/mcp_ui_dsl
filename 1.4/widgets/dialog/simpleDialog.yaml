type: simpleDialog
category: dialog
profile: Core
description: |
  Dialog presenting a list of options.
properties:
  title:
    type: "string"
    description: "Dialog title."
  options:
    type: "array<Option>"
    description: "`{ value, label, icon? }` entries. Required when `children` is omitted."
  children:
    type: "array<Widget>"
    description: "Custom option widgets. Mutually exclusive with `options`."
  onSelect:
    type: "Action"
    description: "Fired when an option is chosen."
  onClose:
    type: "Action"
    description: "Fired when the dialog is dismissed without an option being selected."
  backgroundColor:
    type: Color
    description: "Legacy alias of `color`."
  elevation:
    type: Dimension
    description: "elevation"
  contentPadding:
    type: EdgeInsets
    description: "Promoted from the runtime (2026-08-04): the factory reads `contentPadding`; the registry had not declared it."
  select:
    type: Action
    description: "Promoted from the runtime (2026-08-04): the factory reads `select`; the registry had not declared it."
  shape:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `shape`; the registry had not declared it."
  titlePadding:
    type: Dimension
    description: "Promoted from the runtime (2026-08-04): the factory reads `titlePadding`; the registry had not declared it."
