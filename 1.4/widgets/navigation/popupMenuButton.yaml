type: popupMenuButton
category: navigation
profile: Core
aliases: [dropdownMenu]
description: |
  Button that reveals a popup menu of options.
properties:
  icon:
    type: IconRef
    default: "\"more_vert\""
    description: "Trigger icon. Any `IconRef` form."
  items:
    type: "array<MenuItem>"
    required: true
    description: "`{ value, label, icon?, enabled? }` entries."
  onSelect:
    type: "Action"
    description: "Fired when an item is selected."
  change:
    type: Action
    description: "Legacy alias of `onChange`."
  color:
    type: Color
    description: "color"
  elevation:
    type: Dimension
    description: "elevation"
  onChange:
    type: Action
    description: "onChange"
  enabled:
    type: "boolean"
    description: "Promoted from the runtime (2026-08-04): the factory reads `enabled`; the registry had not declared it."
