type: tabBarView
category: navigation
profile: Core
description: |
  Content area that displays widgets corresponding to the currently selected tab.
properties:
  selectedIndex:
    type: "number | binding"
    description: "Displayed index (usually bound to the same state as a `tabBar`)."
  children:
    type: "array<Widget>"
    required: true
    description: "One child per tab."
  dragStartBehavior:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `dragStartBehavior`; the registry had not declared it."
  physics:
    type: "string"
    description: "Measured from real documents (2026-08-04): string or binding. Promoted from the runtime; type narrowed from the values documents actually pass."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "tabBarView",
        "selectedIndex": "{{activeTab}}",
        "children": [
          { "type": "text", "text": "Overview content" },
          { "type": "text", "text": "Activity content" },
          { "type": "text", "text": "Settings content" }
        ]
      }
