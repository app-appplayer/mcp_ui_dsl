type: chip
category: display
profile: Core
aliases: [tag]
description: |
  Compact element representing an attribute, action, or filter.
properties:
  label:
    type: "string"
    required: true
    description: "Display text."
  avatar:
    type: "Widget"
    description: "Leading widget (icon or image)."
  selected:
    type: "boolean"
    default: false
    description: "Selected state."
  variant:
    type: "string"
    default: "\"filled\""
    description: "`filled` or `outlined`."
  onDelete:
    type: "Action"
    description: "Action when delete icon is tapped."
  onTap:
    type: "Action"
    description: "Action when chip is tapped."
  backgroundColor:
    type: Color
    description: "Legacy alias of `color`."
  elevation:
    type: Dimension
    description: "elevation"
  labelStyle:
    type: TextStyle
    description: "Default text style for item labels (selected and unselected). Per-item override via NavItem.style.labelStyle."
  onPressed:
    type: Action
    description: "Legacy alias of `onTap`."
  delete:
    type: Action
    description: "Promoted from the runtime (2026-08-04): the factory reads `delete`; the registry had not declared it."
  deleteIcon:
    type: "string"
    description: "Promoted from the runtime (2026-08-04): the factory reads `deleteIcon`; the registry had not declared it."
  onDeleted:
    type: Action
    description: "Promoted from the runtime (2026-08-04): the factory reads `onDeleted`; the registry had not declared it."
  padding:
    type: EdgeInsets
    description: "Promoted from the runtime (2026-08-04): the factory reads `padding`; the registry had not declared it."
  shadowColor:
    type: Color
    description: "Promoted from the runtime (2026-08-04): the factory reads `shadowColor`; the registry had not declared it."
  shape:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `shape`; the registry had not declared it."
  side:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `side`; the registry had not declared it."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "chip",
        "label": "Technology",
        "avatar": { "type": "icon", "icon": "tag", "size": 16 },
        "variant": "filled",
        "onDelete": {
          "type": "state", "action": "remove",
          "binding": "selectedTags", "value": "Technology"
        }
      }
