type: fittedBox
category: utility
profile: Core
description: |
  Scales and aligns its child to fit available space.
properties:
  fit:
    type: "string"
    enum: [cover, contain, fill, scaleDown, none]
    default: "\"contain\""
    description: "`cover`, `contain`, `fill`, `scaleDown`, `none`."
  alignment:
    type: Alignment
    default: "\"center\""
    description: "Alignment within the fitted bounds."
  child:
    type: "Widget"
    required: true
    description: "Child widget."
  clipBehavior:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `clipBehavior`; the registry had not declared it."
# examples migrated verbatim from prose JSON fences.
