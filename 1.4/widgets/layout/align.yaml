type: align
category: layout
profile: Core
description: |
  Aligns a single child at a specified alignment.
properties:
  alignment:
    type: Alignment
    default: "\"center\""
    description: Alignment of the child within this widget's bounds. Defaults to `center` when omitted.
  child:
    type: "Widget"
    required: true
    description: "Aligned widget."
  heightFactor:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `heightFactor`; the registry had not declared it."
  widthFactor:
    type: Dimension
    description: "Measured from real documents (2026-08-04): number, `{value, unit}` or a binding. Promoted from the runtime; type narrowed from the values documents actually pass."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      { "type": "align", "alignment": "bottomEnd",
        "child": { "type": "icon", "icon": "close" } }
