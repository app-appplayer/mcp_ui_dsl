type: numberField
category: input
profile: Core
aliases: [numberInput]
description: |
  Specialized input for numeric values. Shared rows per §2.6.0; `value` is `number`.
properties:
  showStepper:
    type: boolean
    default: true
    description: "Render increment/decrement controls. False leaves keyboard entry only."
  label:
    type: "string"
    description: "Field label."
  min:
    type: "number"
    description: "Minimum value."
  max:
    type: "number"
    description: "Maximum value."
  step:
    type: "number"
    default: 1
    description: "Increment size."
  decimalPlaces:
    type: "number"
    default: 0
    description: "Decimal precision."
  prefix:
    type: "string"
    description: "Leading display text (e.g., `\"$\"`)."
  suffix:
    type: "string"
    description: "Trailing display text."
  thousandSeparator:
    type: ["boolean", "string"]
    description: "Thousands separator for display."
  change:
    type: Action
    description: "Legacy alias of `onChange`."
  format:
    type: "string"
    description: "Display format."
  helperText:
    type: "string"
    description: "Helper text shown below the field."
  hint:
    type: "string"
    description: "Legacy alias of `placeholder`."
  decimals:
    type: "number"
    description: "Promoted from the runtime (2026-08-04): the factory reads `decimals`; the registry had not declared it."
  error:
    type: "boolean | binding"
    description: "Measured from real documents (2026-08-04): boolean. Promoted from the runtime; type narrowed from the values documents actually pass."
# examples migrated verbatim from prose JSON fences.
