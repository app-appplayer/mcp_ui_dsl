type: slider
category: input
profile: Core
description: |
  Continuous single-value selection. Shared rows per §2.6.0; `value` is `number`.
properties:
  label:
    type: "string"
    description: "Field label shown beside or above the control."
  value:
    type: "number"
    description: "Current numeric value (overrides shared contract to register `values` legacy alias)."
    aliases:
      - values
  min:
    type: "number"
    default: 0
    description: "Minimum value."
  max:
    type: "number"
    default: 1
    description: "Maximum value."
  divisions:
    type: "number"
    description: "Number of discrete steps."
  change:
    type: Action
    description: "Legacy alias of `onChange`."
  activeColor:
    type: Color
    description: "Promoted from the runtime (2026-08-04): the factory reads `activeColor`; the registry had not declared it."
  change-end:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `change-end`; the registry had not declared it."
  change-start:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `change-start`; the registry had not declared it."
  changeEnd:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `changeEnd`; the registry had not declared it."
  changeStart:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `changeStart`; the registry had not declared it."
  inactiveColor:
    type: Color
    description: "Promoted from the runtime (2026-08-04): the factory reads `inactiveColor`; the registry had not declared it."
  onChangeEnd:
    type: Action
    description: "Promoted from the runtime (2026-08-04): the factory reads `onChangeEnd`; the registry had not declared it."
  onChangeStart:
    type: Action
    description: "Promoted from the runtime (2026-08-04): the factory reads `onChangeStart`; the registry had not declared it."
  thumbColor:
    type: Color
    description: "Promoted from the runtime (2026-08-04): the factory reads `thumbColor`; the registry had not declared it."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "slider",
        "binding": "settings.volume",
        "min": 0, "max": 100, "divisions": 10
      }
