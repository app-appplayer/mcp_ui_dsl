type: singleChildScrollView
category: scroll
profile: Core
description: |
  Lightweight scrollable wrapper for a single child.
properties:
  direction:
    type: "string"
    default: "\"vertical\""
    description: "Scroll direction."
  padding:
    type: "EdgeInsets"
    description: "Inner padding."
  child:
    type: "Widget"
    description: "Scrolled content. Required when `children` is omitted."
  children:
    type: "array<Widget>"
    description: "Multiple widgets; runtime wraps them in a linear column along `direction`. Mutually exclusive with `child`."
  reverse:
    type: "boolean"
    description: "When true, run the transition in reverse direction (for back navigation)."
  scrollDirection:
    type: "string"
    description: "Scroll axis."
  clipBehavior:
    type: any
    description: "Promoted from the runtime (2026-08-04): the factory reads `clipBehavior`; the registry had not declared it."
  physics:
    type: "string"
    description: "Measured from real documents (2026-08-04): string or binding. Promoted from the runtime; type narrowed from the values documents actually pass."
  primary:
    type: "boolean"
    description: "Promoted from the runtime (2026-08-04): the factory reads `primary`; the registry had not declared it."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "singleChildScrollView",
        "direction": "vertical",
        "padding": { "all": 16 },
        "child": {
          "type": "linear", "direction": "vertical",
          "children": [
            { "type": "text", "text": "First section" },
            { "type": "text", "text": "Second section" }
          ]
        }
      }
